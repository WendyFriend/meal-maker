<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
        <meta name="theme-color" content="#fbf5ec" />
        <title>Food lookup</title>
        <style>
            :root {
                --bg: #fbf5ec;
                --surface: #ffffff;
                --text: #244541;
                --muted: #8b9189;
                --border: #e3d9cc;
                --accent: #f4796c;
                --danger: #c8452f;
            }
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body {
                margin: 0;
                padding: 0;
                background: var(--bg);
                color: var(--text);
                font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            .wrap {
                max-width: 560px;
                margin: 0 auto;
                padding: 28px 20px 48px;
            }
            h1 {
                font-size: 17px;
                font-weight: 600;
                margin: 0 0 18px;
                color: var(--text);
                letter-spacing: 0.2px;
            }
            input[type="search"] {
                width: 100%;
                padding: 16px 18px;
                /* 16px prevents iOS Safari from zooming the page on focus */
                font-size: 17px;
                font-family: inherit;
                color: var(--text);
                background: var(--surface);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                outline: none;
                -webkit-appearance: none;
                appearance: none;
                transition: border-color 120ms ease;
            }
            input[type="search"]:focus { border-color: var(--accent); }
            input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

            .input-row {
                display: flex;
                gap: 10px;
                align-items: stretch;
            }
            .input-row input[type="search"] { flex: 1 1 auto; }

            #mic {
                flex: 0 0 auto;
                width: 56px;
                border: 1.5px solid var(--border);
                border-radius: 14px;
                background: var(--surface);
                color: var(--text);
                font-size: 20px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                -webkit-appearance: none;
                appearance: none;
                transition: border-color 120ms ease, background 120ms ease;
            }
            #mic:active { background: #f6efe4; }
            /* Armed: the mic is on and waiting for speech. */
            #mic.listening {
                border-color: var(--accent);
                background: var(--accent);
                color: #fff;
            }
            /* Speaking: pulses so it is obvious the mic is picking the voice up. */
            #mic.hearing {
                animation: pulse 1.1s ease-in-out infinite;
            }
            #mic[disabled] { opacity: 0.4; cursor: default; }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.55; }
            }
            @media (prefers-reduced-motion: reduce) {
                #mic.hearing { animation: none; }
            }

            /* The recognised text, so a mishearing is visible rather than
               silently producing wrong nutrition. */
            #heard {
                margin: 12px 2px 0;
                font-size: 13px;
                color: var(--muted);
                display: none;
            }
            #heard.on { display: block; }
            #heard b { color: var(--text); font-weight: 600; }

            #status {
                min-height: 22px;
                margin: 14px 2px 0;
                font-size: 13px;
                color: var(--muted);
                opacity: 0;
                transition: opacity 140ms ease;
            }
            #status.on { opacity: 1; }

            .mic-hint {
                margin: 10px 2px 0;
                font-size: 12px;
                line-height: 1.45;
                color: var(--muted);
            }

            #trust {
                margin-top: 26px;
                padding-top: 14px;
                border-top: 1px solid var(--border);
                font-size: 12px;
                line-height: 1.5;
                color: var(--muted);
            }
            #trust a { color: var(--accent); font-weight: 600; }

            #card {
                margin-top: 18px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 20px 20px 8px;
                display: none;
            }
            #card.on { display: block; }

            .food-name {
                font-size: 20px;
                font-weight: 650;
                line-height: 1.3;
                margin: 0 0 4px;
            }
            .food-meta {
                font-size: 12.5px;
                color: var(--muted);
                margin-bottom: 18px;
            }
            .food-meta .via {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 999px;
                background: #f2f7f5;
                color: #4d6b64;
                margin-left: 6px;
            }

            .kcal-row {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 14px 0 16px;
                border-bottom: 1px solid var(--border);
            }
            .kcal-value {
                font-size: 34px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            .kcal-unit { font-size: 14px; color: var(--muted); }
            .kcal-per { margin-left: auto; font-size: 12px; color: var(--muted); }

            .macros {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                padding: 16px 0;
            }
            .macro { text-align: center; }
            .macro .v {
                font-size: 19px;
                font-weight: 650;
                font-variant-numeric: tabular-nums;
                display: block;
            }
            .macro .k {
                font-size: 11px;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--muted);
            }

            .detail-list { border-top: 1px solid var(--border); }
            .detail-row {
                display: flex;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid var(--border);
                font-size: 14px;
            }
            .detail-row:last-child { border-bottom: none; }
            .detail-row .k { color: var(--muted); }
            .detail-row .v { font-variant-numeric: tabular-nums; font-weight: 550; }
            .detail-row.sub { padding-left: 18px; font-size: 13px; }
            .detail-row.sub .k { color: #a5aaa2; }

            .group { margin-top: 22px; }
            .group h3 {
                margin: 0 0 2px;
                font-size: 12px;
                font-weight: 650;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--muted);
            }

            /* ---- visualisations ---- */
            .viz { margin-top: 16px; }

            /* Energy split stacked bar */
            .stack {
                display: flex;
                height: 14px;
                border-radius: 7px;
                overflow: hidden;
                background: var(--border);
            }
            .seg { display: block; height: 100%; }
            .seg.p, .dot.p { background: #4f9d8b; }
            .seg.c, .dot.c { background: #d9a441; }
            .seg.f, .dot.f { background: #c2726a; }
            .legend {
                display: flex;
                gap: 14px;
                margin-top: 8px;
                font-size: 12px;
                color: var(--muted);
            }
            .dot {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-right: 5px;
            }

            /* Macro rings */
            .rings { display: flex; gap: 10px; justify-content: space-between; }
            .ring {
                position: relative;
                flex: 1 1 0;
                text-align: center;
                padding: 6px 0 0;
            }
            .ring svg { width: 64px; height: 64px; display: block; margin: 0 auto; }
            .ring-bg { fill: none; stroke: #eee6da; stroke-width: 7; }
            .ring-fg {
                fill: none;
                stroke: var(--accent);
                stroke-width: 7;
                stroke-linecap: round;
                transform: rotate(-90deg);
                transform-origin: 32px 32px;
                transition: stroke-dashoffset 400ms ease;
            }
            .ring-pct {
                position: absolute;
                top: 25px;
                left: 0;
                right: 0;
                font-size: 13px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            .ring-label {
                display: block;
                margin-top: 5px;
                font-size: 11px;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .ring-value { display: block; font-size: 12px; font-weight: 600; }

            /* Nutrient bars */
            .nlist { border-top: 1px solid var(--border); }
            .nrow {
                display: grid;
                grid-template-columns: 108px 1fr 96px;
                gap: 10px;
                align-items: center;
                padding: 7px 0;
                border-bottom: 1px solid var(--border);
                font-size: 13px;
            }
            .nrow:last-child { border-bottom: none; }
            .nrow.sub { padding-left: 12px; font-size: 12px; }
            .nlabel { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .nrow.sub .nlabel { color: #a8ada6; }
            .nbar {
                height: 7px;
                border-radius: 4px;
                background: #f2ece1;
                overflow: hidden;
            }
            /* No reference intake: draw nothing rather than a 0% track. */
            .nbar.none { background: transparent; }
            .nfill {
                display: block;
                height: 100%;
                border-radius: 4px;
                background: #4f9d8b;
            }
            /* Over 100% of a daily reference: flag it, e.g. spinach vitamin K. */
            .nfill.over { background: #d9a441; }
            .nval {
                text-align: right;
                font-variant-numeric: tabular-nums;
                font-weight: 600;
            }
            .nval em {
                display: block;
                font-style: normal;
                font-size: 10.5px;
                color: var(--muted);
                font-weight: 400;
            }
            .nval em.over { color: #b4802c; font-weight: 650; }

            .anti-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
            .anti {
                border-radius: 12px;
                padding: 11px 13px;
                font-size: 13px;
                border-left: 3px solid var(--border);
                background: #f7f4ee;
            }
            .anti-high { border-left-color: #c8452f; background: #fdf3f0; }
            .anti-med { border-left-color: #d99a2b; background: #fdf8ec; }
            .anti-low { border-left-color: #8b9189; background: #f7f4ee; }
            .anti-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
            .anti-name { font-weight: 600; color: var(--text); }
            .anti-level {
                font-size: 10.5px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--muted);
            }
            .anti-tip { margin-top: 5px; color: #5f6b64; line-height: 1.45; }
            /* The per-food finding leads; the compound-level tip, when it
               applies to this food, follows in a lighter weight. */
            .anti-note { margin-top: 5px; color: var(--text); line-height: 1.45; }
            .anti-tip + .anti-note { margin-top: 0; }

            .footnote {
                margin: 20px 0 14px;
                font-size: 11.5px;
                color: #a5aaa2;
                line-height: 1.5;
            }

            /* ---- stated nutrition targets ---- */
            .targets {
                margin: 0 0 14px;
                padding: 11px 13px;
                border-radius: 12px;
                background: #f4f1e9;
                border: 1px solid var(--border);
            }
            .targets-label {
                display: block;
                font-size: 10.5px;
                font-weight: 650;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 7px;
            }
            .targets-chips { display: flex; flex-wrap: wrap; gap: 6px; }
            .target {
                padding: 4px 10px;
                border-radius: 999px;
                background: var(--surface);
                border: 1px solid var(--border);
                font-size: 13px;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }

            /* ---- multi-food result ---- */
            .list-count {
                margin: 0 0 10px;
                font-size: 12px;
                font-weight: 650;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--muted);
            }

            .fcard {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 14px;
                margin-bottom: 10px;
                overflow: hidden;
            }
            .fcard > summary {
                list-style: none;
                cursor: pointer;
                padding: 13px 40px 13px 15px;
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 2px 10px;
                align-items: baseline;
                position: relative;
            }
            .fcard > summary::-webkit-details-marker { display: none; }
            /* Chevron, so it is obvious the row opens. Absolutely positioned so
               it cannot collide with the calorie figure. Points down when
               closed and up when open. */
            .fcard > summary::after {
                content: '';
                position: absolute;
                right: 16px;
                top: 50%;
                width: 8px;
                height: 8px;
                margin-top: -6px;
                border-right: 2px solid var(--muted);
                border-bottom: 2px solid var(--muted);
                transform: rotate(45deg);
                transition: transform 160ms ease, margin-top 160ms ease;
            }
            .fcard[open] > summary::after {
                transform: rotate(-135deg);
                margin-top: -2px;
            }

            /* The word that was searched for, so a split sentence is traceable. */
            .fcard-ask {
                grid-column: 1;
                font-size: 11px;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .fcard-name {
                grid-column: 1;
                font-size: 15px;
                font-weight: 600;
                line-height: 1.3;
            }
            .fcard-kcal {
                grid-column: 2;
                grid-row: 1 / span 2;
                align-self: center;
                font-size: 13px;
                font-weight: 650;
                font-variant-numeric: tabular-nums;
                color: var(--muted);
                white-space: nowrap;
            }
            .fcard-body { padding: 0 15px 4px; border-top: 1px solid var(--border); }
            .fcard-body .group:first-child { margin-top: 16px; }

            .fcard-miss { padding: 13px 15px; }
            .fcard-miss .fcard-name { color: var(--muted); font-weight: 500; }

            .corrected {
                margin: 0 0 10px;
                font-size: 12.5px;
                color: var(--muted);
            }
            .corrected b { color: var(--text); }

            #empty {
                margin-top: 18px;
                padding: 18px;
                border-radius: 14px;
                background: #fdf3f0;
                color: var(--danger);
                font-size: 14px;
                display: none;
            }
            #empty.on { display: block; }

            #skeleton { margin-top: 18px; display: none; }
            #skeleton.on { display: block; }
            .sk {
                height: 14px;
                border-radius: 7px;
                background: linear-gradient(90deg, #f0e8dc 25%, #f7f1e7 50%, #f0e8dc 75%);
                background-size: 200% 100%;
                animation: shimmer 1.2s infinite;
                margin-bottom: 12px;
            }
            .sk.tall { height: 38px; margin-bottom: 18px; }
            @keyframes shimmer {
                from { background-position: 200% 0; }
                to { background-position: -200% 0; }
            }
            @media (prefers-reduced-motion: reduce) {
                .sk { animation: none; }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>What are you cooking with?</h1>

            <div class="input-row">
                <input
                    id="q"
                    type="search"
                    placeholder="e.g. courgette"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="none"
                    spellcheck="false"
                    enterkeyhint="search"
                    autofocus
                />
                <button id="mic" type="button" aria-label="Speak an ingredient" title="Speak an ingredient">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3Z" />
                        <path d="M5 11a7 7 0 0 0 14 0" />
                        <path d="M12 18v3" />
                    </svg>
                </button>
            </div>

            <div id="heard" role="status" aria-live="polite"></div>

            <div id="status" role="status" aria-live="polite"></div>
            <div id="skeleton" aria-hidden="true">
                <div class="sk tall"></div>
                <div class="sk" style="width: 70%"></div>
                <div class="sk" style="width: 88%"></div>
                <div class="sk" style="width: 55%"></div>
            </div>
            <div id="empty" role="alert"></div>
            <div id="card" aria-live="polite"></div>

            <footer id="trust" hidden>
                <a id="trust-link" href="/ca.pem" download>Install certificate</a>
                <span>to stop the browser warning, then reopen this page over https.</span>
            </footer>
        </div>

        <script type="module">
            const $ = (id) => document.getElementById(id);
            const DEBOUNCE_MS = 1000;

            let timer = null;
            let controller = null;
            // Incremented per request so a slow earlier reply cannot overwrite a
            // newer one.
            let requestId = 0;
            let lastQuery = '';

            const num = (v, digits = 1) =>
                v == null ? '—' : Number(v).toFixed(digits).replace(/\.0$/, '');

            function setStatus(text) {
                $('status').textContent = text ?? '';
                $('status').classList.toggle('on', Boolean(text));
            }

            // While the mic is armed the status line belongs to it, otherwise a
            // lookup finishing would blank the "Listening" indicator.
            function refreshStatus() {
                setStatus(listening ? LISTENING_TEXT : '');
            }

            function clearOutput() {
                $('card').classList.remove('on');
                $('card').innerHTML = '';
                $('empty').classList.remove('on');
                $('skeleton').classList.remove('on');
            }

            $('q').addEventListener('input', (event) => {
                const value = event.target.value.trim();
                clearTimeout(timer);

                if (value.length < 2) {
                    clearOutput();
                    setStatus('');
                    lastQuery = '';
                    return;
                }
                if (value === lastQuery) return;

                setStatus('');
                // Nothing is rendered until the lookup returns, so the user only
                // ever sees a final answer.
                timer = setTimeout(() => run(value), DEBOUNCE_MS);
            });

            // Enter should not wait out the debounce.
            $('q').addEventListener('keydown', (event) => {
                if (event.key !== 'Enter') return;
                const value = event.target.value.trim();
                if (value.length < 2) return;
                clearTimeout(timer);
                run(value);
            });

            async function run(term) {
                lastQuery = term;
                const id = ++requestId;

                controller?.abort();
                controller = new AbortController();

                clearOutput();
                $('skeleton').classList.add('on');
                setStatus('Looking up…');

                try {
                    const response = await fetch(`/api/lookup?q=${encodeURIComponent(term)}`, {
                        signal: controller.signal,
                    });
                    const data = await response.json();

                    // A newer keystroke superseded this request.
                    if (id !== requestId) return;

                    $('skeleton').classList.remove('on');

                    if (data.status !== 'ok') {
                        refreshStatus();
                        // Nothing matched even after splitting and correcting:
                        // say so plainly rather than leaving the previous card.
                        clearOutput();
                        $('empty').textContent = `No match for “${term}”.`;
                        $('empty').classList.add('on');
                        return;
                    }

                    if (data.multi) {
                        renderList(
                            data.items.map((item) => ({ ...item, said: item.query })),
                            data.targets,
                        );
                    } else {
                        render(data);
                    }
                    refreshStatus();
                } catch (error) {
                    if (error.name === 'AbortError') return;
                    $('skeleton').classList.remove('on');
                    refreshStatus();
                    $('empty').textContent = 'Lookup failed. Check the connection and try again.';
                    $('empty').classList.add('on');
                }
            }

            // Human-readable name for each nutrient a spoken target can name.
            const TARGET_LABEL = {
                calories: 'Calories',
                protein: 'Protein',
                carbs: 'Carbs',
                fat: 'Fat',
                fibre: 'Fibre',
                sugar: 'Sugar',
                sodium: 'Sodium',
                cholesterol: 'Cholesterol',
            };

            /**
             * Shows nutrition figures the speaker stated, e.g. "30% protein" or
             * "500 calories". Display only — nothing consumes these yet.
             *
             * Rendered above the card so the claim is visible next to the real
             * values rather than buried in it.
             */
            function targetsHtml(targets) {
                if (!Array.isArray(targets) || !targets.length) return '';

                const chips = targets
                    .map((t) => {
                        const label = TARGET_LABEL[t.nutrient] ?? t.nutrient;
                        const value = num(t.amount, Number.isInteger(t.amount) ? 0 : 1);
                        // A percentage is "of energy", which is not obvious from
                        // the number alone.
                        const unit =
                            t.unit === '%' ? '% of energy' : t.unit === 'kcal' ? ' kcal' : ` ${t.unit}`;
                        return `<span class="target">${label} ${value}${unit}</span>`;
                    })
                    .join('');

                return `<div class="targets">
                    <span class="targets-label">You asked for</span>
                    <div class="targets-chips">${chips}</div>
                </div>`;
            }

            /**
             * Builds the markup for one food. Returns a string so the same code
             * serves both a single card and a list of collapsible cards.
             */
            function foodCardHtml(data, { collapsible = false, open = false, index = 0 } = {}) {
                const f = data.food;
                const title = f.description;

                // Rows are grouped so a long panel stays readable on a phone.
                const groups = [
                    {
                        title: 'Macros',
                        rows: [
                            ['Protein', f.protein_g, 'g'],
                            ['Fat', f.fat_g, 'g'],
                            ['  of which saturates', f.sat_fat_g, 'g'],
                            ['  monounsaturated', f.monofat_g, 'g'],
                            ['  polyunsaturated', f.polyfat_g, 'g'],
                            ['  trans fat', f.trans_fat_g, 'g'],
                            ['Carbohydrate', f.carb_g, 'g'],
                            ['  of which sugars', f.sugar_g, 'g'],
                            ['Fibre', f.fiber_g, 'g'],
                            ['Water', f.water_g, 'g'],
                        ],
                    },
                    {
                        title: 'Minerals',
                        rows: [
                            ['Sodium', f.sodium_mg, 'mg'],
                            ['Potassium', f.potassium_mg, 'mg'],
                            ['Calcium', f.calcium_mg, 'mg'],
                            ['Iron', f.iron_mg, 'mg'],
                            ['Magnesium', f.magnesium_mg, 'mg'],
                            ['Phosphorus', f.phosphorus_mg, 'mg'],
                            ['Zinc', f.zinc_mg, 'mg'],
                        ],
                    },
                    {
                        title: 'Vitamins',
                        rows: [
                            ['Vitamin A', f.vitamin_a_ug, 'µg'],
                            ['Vitamin C', f.vitamin_c_mg, 'mg'],
                            ['Vitamin D', f.vitamin_d_ug, 'µg'],
                            ['Vitamin E', f.vitamin_e_mg, 'mg'],
                            ['Vitamin K', f.vitamin_k_ug, 'µg'],
                            ['Thiamin (B1)', f.thiamin_mg, 'mg'],
                            ['Riboflavin (B2)', f.riboflavin_mg, 'mg'],
                            ['Niacin (B3)', f.niacin_mg, 'mg'],
                            ['Vitamin B6', f.b6_mg, 'mg'],
                            ['Folate', f.folate_ug, 'µg'],
                            ['Vitamin B12', f.b12_ug, 'µg'],
                        ],
                    },
                    {
                        title: 'Other',
                        rows: [
                            ['Cholesterol', f.cholesterol_mg, 'mg'],
                            ['Caffeine', f.caffeine_mg, 'mg'],
                            ['Ash', f.ash_g, 'g'],
                        ],
                    },
                ];

                // Daily reference intakes (adult). Bars turn "28 mg vitamin C"
                // into a visual share of a day.
                const DAILY = {
                    Sodium: 2300, Potassium: 3500, Calcium: 800, Iron: 14,
                    Magnesium: 375, Phosphorus: 700, Zinc: 10,
                    'Vitamin A': 900, 'Vitamin C': 90, 'Vitamin D': 20,
                    'Vitamin E': 15, 'Vitamin K': 120,
                    'Thiamin (B1)': 1.2, 'Riboflavin (B2)': 1.3,
                    'Niacin (B3)': 16, 'Vitamin B6': 1.3,
                    Folate: 400, 'Vitamin B12': 2.4, Fibre: 30,
                };

                const barRow = ([label, value, unit]) => {
                    if (value == null) return '';
                    const indent = label.startsWith('  ');
                    const text = indent ? label.trim() : label;
                    const ref = DAILY[text];
                    const ratio = ref ? (value / ref) * 100 : null;
                    const pct = ref ? Math.min(ratio, 100) : null;
                    const shown = ref ? Math.round(ratio) : null;
                    // A grey track with no fill reads as "0%", which is wrong
                    // when USDA simply did not measure it. Only draw a bar when
                    // there is a reference intake to measure against.
                    return `<div class="nrow${indent ? ' sub' : ''}">
                        <span class="nlabel">${text}</span>
                        <span class="nbar${pct == null ? ' none' : ''}">${
                            pct == null
                                ? ''
                                : `<span class="nfill${ratio > 100 ? ' over' : ''}" style="width:${pct}%"></span>`
                        }</span>
                        <span class="nval">${num(value, value < 1 ? 2 : 1)} ${unit}${
                            shown != null ? `<em class="${ratio > 100 ? 'over' : ''}">${shown}%</em>` : ''
                        }</span>
                    </div>`;
                };

                // Only render nutrients the food actually reports. A missing
                // value means "not measured", so showing a dash for 30 rows
                // would be noise rather than information.
                const groupHtml = groups
                    .map((group) => {
                        const rows = group.rows
                            .filter(([, v]) => v != null && v !== undefined)
                            .map(barRow)
                            .join('');
                        return rows
                            ? `<div class="group"><h3>${group.title}</h3><div class="nlist">${rows}</div></div>`
                            : '';
                    })
                    .join('');

                // Anti-nutrients: only actual findings are returned by the
                // query, so anything present here is worth stating.
                //
                // `finding` is the per-food note from the matching rule and is
                // what the card should lead with. `mitigation` is written once
                // per compound, so it can be about a different food entirely —
                // the query blanks it in that case, which is why it is optional.
                const anti = (f.antinutrients ?? []).map((a) => {
                    const cls =
                        a.level === 'high'
                            ? 'anti-high'
                            : a.level === 'medium'
                              ? 'anti-med'
                              : 'anti-low';
                    const finding = a.finding && a.finding !== a.mitigation ? a.finding : '';
                    return `<div class="anti ${cls}">
                        <div class="anti-head">
                            <span class="anti-name">${a.name}</span>
                            <span class="anti-level">${a.level ?? ''}</span>
                        </div>
                        ${finding ? `<div class="anti-note">${finding}</div>` : ''}
                        ${a.mitigation ? `<div class="anti-tip">${a.mitigation}</div>` : ''}
                    </div>`;
                }).join('');

                const antiSection = anti
                    ? `<div class="group"><h3>Anti-nutrients</h3><div class="anti-list">${anti}</div></div>`
                    : '';

                // ---- graphics -------------------------------------------------
                // Energy split uses the Atwater factors (4/4/9 kcal per gram),
                // shown as a stacked bar so the dominant macro is obvious.
                const pKcal = (f.protein_g ?? 0) * 4;
                const cKcal = (f.carb_g ?? 0) * 4;
                const fKcal = (f.fat_g ?? 0) * 9;
                const eTotal = pKcal + cKcal + fKcal;

                const energyBar =
                    eTotal > 0
                        ? `<div class="viz">
                             <div class="stack">
                               <span class="seg p" style="width:${(pKcal / eTotal) * 100}%"></span>
                               <span class="seg c" style="width:${(cKcal / eTotal) * 100}%"></span>
                               <span class="seg f" style="width:${(fKcal / eTotal) * 100}%"></span>
                             </div>
                             <div class="legend">
                               <span><i class="dot p"></i>Protein ${Math.round((pKcal / eTotal) * 100)}%</span>
                               <span><i class="dot c"></i>Carbs ${Math.round((cKcal / eTotal) * 100)}%</span>
                               <span><i class="dot f"></i>Fat ${Math.round((fKcal / eTotal) * 100)}%</span>
                             </div>
                           </div>`
                        : '';

                // Macro rings: share of a daily reference intake per 100 g.
                const RINGS = [
                    ['Protein', f.protein_g, 50, 'g'],
                    ['Carbs', f.carb_g, 260, 'g'],
                    ['Fat', f.fat_g, 70, 'g'],
                ];

                const ring = ([label, value, ref, unit]) => {
                    if (value == null) return '';
                    const pct = Math.min((value / ref) * 100, 100);
                    const shown = Math.round((value / ref) * 100);
                    const r = 26;
                    const circ = 2 * Math.PI * r;
                    return `<div class="ring">
                        <svg viewBox="0 0 64 64" aria-hidden="true">
                            <circle class="ring-bg" cx="32" cy="32" r="${r}" />
                            <circle class="ring-fg" cx="32" cy="32" r="${r}"
                                stroke-dasharray="${circ.toFixed(1)}"
                                stroke-dashoffset="${(circ - (circ * pct) / 100).toFixed(1)}" />
                        </svg>
                        <span class="ring-pct">${shown}%</span>
                        <span class="ring-label">${label}</span>
                        <span class="ring-value">${num(value)} ${unit}</span>
                    </div>`;
                };

                const macroDonut = `<div class="viz"><div class="rings">${RINGS.map(ring).join('')}</div></div>`;

                const header = `
                    <p class="food-name">${title}</p>
                    <div class="food-meta">
                        ${f.category ?? ''}
                        ${data.model ? '<span class="via">matched by model</span>' : ''}
                    </div>

                    <div class="kcal-row">
                        <span class="kcal-value">${f.kcal == null ? '—' : Math.round(f.kcal)}</span>
                        <span class="kcal-unit">kcal</span>
                        <span class="kcal-per">per 100 g</span>
                    </div>`;

                const panel = `
                    ${energyBar}
                    ${macroDonut}
                    ${groupHtml}
                    ${antiSection}

                    <p class="footnote">Values per 100 g. Bars show this food's share of a typical daily reference intake. Blank means USDA did not report that nutrient.</p>`;

                if (!collapsible) return `${header}${panel}`;

                // A collapsed card still shows energy and macros, so the list is
                // scannable; the full panel with minerals and vitamins is behind
                // the expander. This keeps a four-food result to one screen.
                return `<details class="fcard"${open ? ' open' : ''}>
                    <summary>
                        <span class="fcard-ask">${data.said ?? data.query ?? ''}</span>
                        <span class="fcard-name">${title}</span>
                        <span class="fcard-kcal">${f.kcal == null ? '—' : Math.round(f.kcal)} kcal</span>
                    </summary>
                    <div class="fcard-body">
                        <div class="food-meta">
                            ${f.category ?? ''}
                            ${data.model ? '<span class="via">matched by model</span>' : ''}
                        </div>
                        <div class="viz">${energyBar.replace(/<div class="viz">|<\/div>\s*$/g, '')}</div>
                        ${groupHtml}
                        ${antiSection}
                        <p class="footnote">Values per 100 g. Blank means USDA did not report that nutrient.</p>
                    </div>
                </details>`;
            }

            /** Renders one food as a single card. */
            function render(data) {
                const note = data.correctedTo
                    ? `<p class="corrected">Searched for <b>${data.correctedTo}</b></p>`
                    : '';
                $('card').innerHTML = targetsHtml(data.targets) + note + foodCardHtml(data);
                $('card').classList.add('on');
            }

            /**
             * Renders several foods, each collapsible. Used when the input named
             * more than one ingredient.
             */
            function renderList(items, targets) {
                const cards = items
                    .map((item, index) =>
                        item.status === 'ok'
                            ? foodCardHtml(item, { collapsible: true, open: false, index })
                            : `<div class="fcard fcard-miss">
                                   <span class="fcard-ask">${item.said ?? item.query ?? ''}</span>
                                   <span class="fcard-name">no match</span>
                               </div>`,
                    )
                    .join('');

                $('card').innerHTML = `
                    ${targetsHtml(targets)}
                    <p class="list-count">${items.length} foods</p>
                    ${cards}`;
                $('card').classList.add('on');
            }

            // ------------------------------------------------------------------
            // Voice input
            //
            // Records from the mic, stops when the speaker pauses, sends the clip
            // for transcription, then runs the normal lookup. A new utterance
            // simply replaces the card - there is no history.
            //
            // Silence detection uses a WebAudio analyser rather than a fixed
            // timer, so it adapts to background noise. The threshold is relative
            // to a measured noise floor, because a kitchen with a range hood is
            // far louder than a quiet room.
            //
            // Continuous mode: once the mic is on it stays on. Each time the
            // speaker stops, that utterance is transcribed and looked up, and
            // recording restarts immediately so the next word needs no tap. That
            // is why the stream and AudioContext are opened once and released
            // only on an explicit stop - rebuilding them per utterance left an
            // audible gap and repeated the permission round-trip every time.
            // ------------------------------------------------------------------

            const SILENCE_MS = 900;      // pause length that ends an utterance
            const MIN_SPEECH_MS = 300;   // ignore clicks and coughs
            const MAX_CLIP_MS = 10000;   // safety cap for a single utterance
            const NOISE_MULTIPLIER = 2.2;

            let recorder = null;
            let listening = false;       // mic is powered on at all
            let capturing = false;       // one utterance is being recorded
            let audioCtx = null;
            let analyser = null;
            let stream = null;
            let noiseFloor = 0.01;
            // Set when stopping on purpose, so the restart loop stands down.
            let stopping = false;
            // Incremented per utterance so a late callback from a previous one
            // cannot clobber the state of the current one.
            let utterance = 0;

            const LISTENING_TEXT = 'Listening — speak an ingredient.';

            const supported =
                typeof navigator.mediaDevices?.getUserMedia === 'function' &&
                typeof window.MediaRecorder === 'function';

            if (!supported) {
                $('mic').disabled = true;
                // Distinguish the two causes: a dead mic on a phone is almost
                // always the insecure-context rule, which is confusing because
                // the page itself works fine over http.
                const insecure = !window.isSecureContext;
                $('mic').title = insecure
                    ? 'Voice needs HTTPS. Open the https:// address shown in the server log.'
                    : 'This browser has no MediaRecorder support.';

                const hint = document.createElement('p');
                hint.className = 'mic-hint';
                hint.textContent = insecure
                    ? 'Voice input needs a secure (https) connection — type instead, or open the https address from the server log.'
                    : 'This browser cannot record audio — type instead.';
                document.querySelector('header')?.after(hint);
            }

            // On https from another device the certificate is self-signed, so
            // the browser shows a warning on every visit until it is installed.
            // Offer the download rather than leaving the user to dismiss it.
            if (
                location.protocol === 'https:' &&
                !['localhost', '127.0.0.1'].includes(location.hostname)
            ) {
                $('trust').hidden = false;
            }

            $('mic').addEventListener('click', async () => {
                if (!supported) return;
                // The button is a toggle for the whole session, not for one
                // utterance: one tap starts listening, a second tap stops.
                if (listening) {
                    await stopListening();
                } else {
                    await startListening();
                }
            });

            /**
             * Opens the mic and starts the listen loop. Stays open until
             * stopListening() is called.
             */
            async function startListening() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            // Processing that helps with kitchen noise.
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                        },
                    });
                } catch (error) {
                    setStatus(
                        error.name === 'NotAllowedError'
                            ? 'Microphone permission denied.'
                            : 'Could not open the microphone.',
                    );
                    return;
                }

                listening = true;
                stopping = false;
                noiseFloor = 0.01;
                // One AudioContext for the whole session: creating one per
                // utterance hits the browser's limit of ~6 and then throws.
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                audioCtx.createMediaStreamSource(stream).connect(analyser);

                $('mic').classList.add('listening');
                setStatus(LISTENING_TEXT);
                beginUtterance();
            }

            /** Sends the audio so far and keeps the session open. */
            async function stopListening() {
                stopping = true;
                listening = false;
                // Invalidate the current utterance so its level loop stops even
                // if it is mid-flight.
                utterance += 1;
                $('mic').classList.remove('listening', 'hearing');
                setStatus('');
                // Stopping is a cancel, not a commit: discard whatever was
                // partially recorded rather than transcribing it.
                capturing = false;
                try {
                    recorder?.state === 'recording' && recorder.stop();
                } catch {
                    /* already stopped */
                }
                stream?.getTracks().forEach((track) => track.stop());
                stream = null;
                await audioCtx?.close().catch(() => {});
                audioCtx = null;
                analyser = null;
            }

            /**
             * Starts recording one utterance and watches its level. When the
             * speaker pauses long enough, the clip is sent and the next
             * utterance starts straight away.
             */
            function beginUtterance() {
                if (!listening || stopping) return;

                const id = ++utterance;
                const chunks = [];
                // Safari cannot record webm at all: it only offers mp4/aac.
                // Picking the first supported type keeps the mic working on
                // iOS instead of throwing when MediaRecorder is constructed.
                // The server sniffs the container from the bytes, so any of
                // these is accepted.
                const mime = [
                    'audio/webm;codecs=opus',
                    'audio/webm',
                    'audio/mp4',
                    'audio/ogg;codecs=opus',
                ].find((type) => MediaRecorder.isTypeSupported(type));

                // Undefined means "let the browser choose", which is a valid
                // and preferable option when nothing in the list matched.
                recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
                recorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };
                recorder.__chunks = chunks;

                capturing = true;
                recorder.start();

                const buffer = new Float32Array(analyser.fftSize);
                let quietSince = null;
                let speechSeen = false;
                // When speech actually started, so MIN_SPEECH_MS measures spoken
                // audio rather than the silence before it.
                let speechBegan = 0;
                const began = performance.now();

                const tick = () => {
                    // A newer utterance superseded this loop.
                    if (id !== utterance) return;

                    if (!capturing) {
                        // Stopped mid-utterance; endUtterance handles the rest.
                        return;
                    }

                    analyser.getFloatTimeDomainData(buffer);
                    let sum = 0;
                    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
                    const level = Math.sqrt(sum / buffer.length);

                    // Adapt the floor downwards while quiet, so a steady hum
                    // becomes the baseline rather than triggering detection.
                    if (level < noiseFloor) noiseFloor = noiseFloor * 0.9 + level * 0.1;
                    else noiseFloor = noiseFloor * 0.999 + level * 0.001;

                    const threshold = Math.max(noiseFloor * NOISE_MULTIPLIER, 0.012);

                    if (level > threshold) {
                        if (!speechSeen) {
                            speechSeen = true;
                            speechBegan = performance.now();
                            // Only signal "hearing you" once real speech starts.
                            $('mic').classList.add('hearing');
                        }
                        quietSince = null;
                    } else if (speechSeen) {
                        quietSince ??= performance.now();
                        if (performance.now() - quietSince >= SILENCE_MS) {
                            $('mic').classList.remove('hearing');
                            // A brief click can trip the threshold; require a
                            // minimum of actual speech before spending a
                            // transcription on it.
                            const spokeFor = quietSince - speechBegan;
                            endUtterance({ spoke: spokeFor >= MIN_SPEECH_MS });
                            return;
                        }
                    }

                    if (performance.now() - began >= MAX_CLIP_MS) {
                        $('mic').classList.remove('hearing');
                        // An utterance that ran to the cap still had speech in it.
                        endUtterance({
                            spoke: speechSeen && performance.now() - speechBegan >= MIN_SPEECH_MS,
                        });
                        return;
                    }

                    requestAnimationFrame(tick);
                };

                requestAnimationFrame(tick);
            }

            /**
             * Stops the current recording, sends it if it contained speech, and
             * restarts listening unless the session was stopped.
             *
             * `spoke` is passed explicitly because the caller knows whether any
             * speech was detected, and the state is reset here before the await
             * that sends the clip.
             */
            async function endUtterance({ spoke = false } = {}) {
                if (!capturing) return;
                capturing = false;

                const current = recorder;
                const chunks = current?.__chunks ?? [];

                const stopped = new Promise((resolve) => {
                    current?.addEventListener('stop', resolve, { once: true });
                });
                try {
                    current?.stop();
                } catch {
                    /* already stopped */
                }
                await stopped;

                $('mic').classList.remove('hearing');

                // Continue listening before the network round-trip, so the next
                // ingredient can be spoken while this one is still transcribing.
                if (listening && !stopping) {
                    setStatus(LISTENING_TEXT);
                    beginUtterance();
                }

                if (!spoke) return;

                const blob = new Blob(chunks, { type: current.mimeType });
                await transcribeAndSearch(blob);
            }

            async function transcribeAndSearch(blob) {
                if (!blob.size) {
                    setStatus('Nothing recorded.');
                    return;
                }

                clearOutput();
                $('skeleton').classList.add('on');
                setStatus('Transcribing…');

                try {
                    const response = await fetch('/api/transcribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/octet-stream' },
                        body: blob,
                    });
                    const data = await response.json();

                    if (!response.ok || !data.text) {
                        $('skeleton').classList.remove('on');
                        // Show the failure briefly, then fall back to the
                        // listening indicator without stealing focus from it.
                        setStatus('Nothing heard.');
                        window.setTimeout(() => refreshStatus(), 1600);
                        return;
                    }

                    // Show what was heard so a mishearing is visible.
                    const heard = data.text.trim();
                    $('heard').innerHTML = `Heard: <b>${heard.replace(/[<>&]/g, '')}</b>`;
                    $('heard').classList.add('on');

                    // Replaces the card rather than appending.
                    $('q').value = heard;
                    await run(heard);
                } catch {
                    $('skeleton').classList.remove('on');
                    setStatus('Transcription failed.');
                    window.setTimeout(() => refreshStatus(), 1600);
                }
            }
        </script>
    </body>
</html>
